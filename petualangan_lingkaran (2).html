<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misi Rahasia Kerajaan Lingkaran</title>
<style>
/* ===== TEMA: ubah warna di sini ===== */
:root{--bg:#120d33;--pur:#7c5cff;--gold:#ffc94d;--grn:#3ddc97;--blu:#4cc9f0;--txt:#f4f1ff;--card:rgba(255,255,255,.09)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 0,#2b1d7a,var(--bg) 70%);color:var(--txt);font-family:"Trebuchet MS","Segoe UI",sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.7;animation:tw 4s infinite alternate;
background:radial-gradient(2px 2px at 10% 20%,#fff,transparent),radial-gradient(2px 2px at 30% 70%,var(--gold),transparent),radial-gradient(1.5px 1.5px at 55% 35%,#fff,transparent),radial-gradient(2px 2px at 75% 80%,#fff,transparent),radial-gradient(2px 2px at 90% 15%,var(--gold),transparent),radial-gradient(1.5px 1.5px at 65% 55%,#fff,transparent)}
@keyframes tw{to{opacity:.25}}
#stage{position:relative;height:calc(100% - 62px)}
.s{position:absolute;inset:0;padding:2vh 5vw;overflow:auto;opacity:0;visibility:hidden;transform:translateX(50px);transition:opacity .5s,transform .5s,visibility .5s}
.s.on{opacity:1;visibility:visible;transform:none}.s.out{transform:translateX(-50px)}
h1{font-size:clamp(28px,5vw,62px);margin:.2em 0;color:var(--gold)}
h2{font-size:clamp(22px,3.3vw,40px);margin:.1em 0 .3em;color:var(--gold)}
p,li{font-size:clamp(15px,1.9vw,24px);line-height:1.45}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:14px 18px;flex:1 1 260px}
.big{font-size:clamp(28px,5vw,60px);text-align:center;color:var(--grn);font-weight:700;margin:.2em 0}
.em{font-size:clamp(36px,6vw,72px)}.fl{animation:fl 3s ease-in-out infinite alternate;display:inline-block}
@keyframes fl{to{transform:translateY(-12px)}}
.btn{background:var(--pur);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-size:clamp(14px,1.7vw,20px);cursor:pointer;margin:3px}
.btn:hover{filter:brightness(1.2)}.btn:focus-visible,input:focus-visible{outline:3px solid var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sel{background:var(--gold);color:#222}.btn.ok{background:var(--grn);color:#062}.btn.no{background:#ff6b81}
input[type=text],textarea{font:inherit;font-size:clamp(14px,1.8vw,22px);padding:8px 12px;border-radius:10px;border:2px solid var(--pur);background:#1d1650;color:#fff;max-width:100%}
input[type=range]{width:min(420px,90%);accent-color:var(--gold)}
.hid{display:none}.note{border-left:5px solid var(--gold);padding-left:12px}
.bub{background:#fff;color:#241a63;border-radius:16px;padding:10px 16px;font-size:clamp(14px,1.8vw,22px)}
table{border-collapse:collapse;width:100%;font-size:clamp(13px,1.7vw,22px)}td,th{border-bottom:1px solid #fff4;padding:6px;text-align:center}
.map{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:3vh}
.loc{flex:1 1 150px;max-width:200px;text-align:center;opacity:.5;filter:grayscale(1);transition:.6s}.loc.act{opacity:1;filter:none;border-color:var(--gold);box-shadow:0 0 20px var(--gold)}
.spin{transform-origin:100px 100px;animation:sp 14s linear infinite}.spin2{transform-origin:100px 100px;animation:sp 9s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}
.star{position:fixed;font-size:30px;pointer-events:none;animation:bs 1.2s forwards;z-index:9}
@keyframes bs{to{transform:translate(var(--x),var(--y)) scale(1.6);opacity:0}}
.pulse{animation:pu 2s infinite alternate}@keyframes pu{to{fill-opacity:.15}}
#bar{position:fixed;bottom:0;left:0;right:0;height:62px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#0b0824ee}
#pg{flex:1;height:26px;background:#fff2;border-radius:13px;position:relative;overflow:hidden}
#pf{height:100%;width:0;background:linear-gradient(90deg,var(--pur),var(--gold));transition:width .5s}
#pt{position:absolute;inset:0;text-align:center;line-height:26px;font-size:13px}
/* ===== PENYEMPURNAAN TAMPILAN: laptop, proyektor, HP (bagian ini aman diedit) ===== */
/* Lebar isi dibatasi 1180px agar tidak melebar di layar besar, dan tetap di tengah */
.s{padding:3vh max(5vw,calc((100% - 1180px)/2));scrollbar-width:thin;scrollbar-color:var(--pur) transparent}
/* Judul: lebih tegas dan terbaca dari jauh */
h1,h2{line-height:1.15;text-shadow:0 2px 16px #ffc94d55}
h1{text-align:center}
h2{padding-bottom:.25em;margin-bottom:.55em;border-bottom:3px solid #ffc94d44}
/* Teks isi sedikit lebih besar untuk proyektor */
p,li{font-size:clamp(16px,2.1vw,28px)}
svg{max-width:100%;height:auto}
/* Kartu, catatan, dan balon bicara */
.card{background:linear-gradient(160deg,#ffffff1c,#ffffff08);box-shadow:0 8px 24px #0006}
.note{background:#ffc94d14;border-radius:0 14px 14px 0;padding:8px 14px}
.bub{box-shadow:0 6px 18px #0005}
/* Tombol: area sentuh minimal 44px, ada efek tekan */
.btn{min-height:44px;box-shadow:0 3px 0 #0007;transition:transform .15s,filter .15s}
.btn:active{transform:translateY(2px);box-shadow:none}
.op{display:block;width:min(680px,100%);text-align:left}
/* Tabel, kolom isian, slider */
th{color:var(--gold)}tr:nth-child(even) td{background:#ffffff0d}
::placeholder{color:#b9b0ff}
input[type=range]{height:30px}
/* Layar HP / sempit */
@media(max-width:700px){#bar{gap:6px;padding:0 8px}#prev,#next{padding:8px 10px;font-size:13px}#pt{font-size:11px}.row{gap:10px}.card{padding:10px 12px}}
/* Layar pendek (proyektor lanskap / jendela kecil) */
@media(max-height:620px){.em{font-size:38px}p,li{font-size:15px}h2{font-size:22px}.big{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="stage"></div>
<nav id="bar"><button class="btn" id="prev">◀ Sebelumnya</button><div id="pg"><div id="pf"></div><span id="pt"></span></div><button class="btn" id="fs" title="Layar penuh (F)">⛶</button><button class="btn" id="next">Berikutnya ▶</button></nav>
<script>
/* ===== Pembantu umum ===== */
const f2=x=>x.toFixed(2).replace('.',','), f4=x=>x.toFixed(4).replace('.',',');
const S=[]; // daftar slide: {t:judul, h:html, i:fungsi inisialisasi}
const add=(t,h,i)=>S.push({t,h,i});
// Lokasi peta: [nama, ikon, slide pertama (indeks), slide selesai (indeks)]
const LOC=[["Desa Bentuk Geometri","🏘️",2,4],["Hutan Misteri π","🌲",4,8],["Menara Jari-Jari dan Diameter","🗼",8,10],["Gua Luas Lingkaran","🕳️",10,12],["Istana Keliling Lingkaran","🏰",12,15]];
// Tombol "Lihat jawaban"
document.addEventListener('click',e=>{const b=e.target.closest('.rv');if(b){b.nextElementSibling.classList.toggle('hid')}
 const k=e.target.closest('.sb');if(k){const h=k.previousElementSibling.querySelector('.hid');if(h)h.classList.remove('hid');if(!k.previousElementSibling.querySelector('.hid'))k.disabled=true}});
function burst(){for(let i=0;i<14;i++){const s=document.createElement('span');s.className='star';s.textContent='⭐';s.style.left='50%';s.style.top='50%';s.style.setProperty('--x',(Math.random()*500-250)+'px');s.style.setProperty('--y',(Math.random()*400-300)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}
// Soal latihan acak: k='L' (luas) atau 'K' (keliling), π = 22/7
function pr(el,k){let a,u;function nw(){const v=[7,14,21,28][Math.random()*4|0],r=Math.random()<.5;let q;
 if(k=='L'){q=`Taman berbentuk lingkaran berjari-jari ${v} m. Berapa luasnya? (π = 22/7)`;a=22*v*v/7;u='m²'}
 else if(r){q=`Kolam berbentuk lingkaran berjari-jari ${v} m. Berapa kelilingnya? (π = 22/7)`;a=44*v/7;u='m'}
 else{q=`Kolam berbentuk lingkaran berdiameter ${v} m. Berapa kelilingnya? (π = 22/7)`;a=22*v/7;u='m'}
 el.innerHTML=`<p>${q}</p><input type="text" inputmode="decimal" size="8"> ${u} <button class="btn">Periksa</button><button class="btn">Soal baru</button><p class="fb"></p>`;
 const[c,n]=el.querySelectorAll('button'),inp=el.querySelector('input'),fb=el.querySelector('.fb');
 n.onclick=nw;c.onclick=()=>{const x=parseFloat(inp.value.replace(',','.'));if(Math.abs(x-a)<.01){fb.textContent=`✅ Benar! Jawabannya ${a} ${u}.`;burst()}else fb.textContent=`❌ Belum tepat. Petunjuk: ${k=='L'?'L = π × r × r':'K = π × d  atau  K = 2 × π × r'}. Coba lagi!`}}nw()}

/* ===== 1. Sampul ===== */
add("Sampul",`<div class="row" style="min-height:70vh"><div class="em fl">🧒</div><div style="text-align:center;flex:2 1 320px">
<h1>Misi Rahasia Kerajaan Lingkaran</h1><p>Menemukan Kekuatan π bersama Alex dan Mira</p>
<svg viewBox="0 0 200 200" width="220"><defs><radialGradient id="gl"><stop offset="60%" stop-color="#ffc94d" stop-opacity="0"/><stop offset="100%" stop-color="#ffc94d" stop-opacity=".6"/></radialGradient></defs>
<circle cx="100" cy="100" r="96" fill="url(#gl)"/><g class="spin"><circle cx="100" cy="100" r="80" fill="none" stroke="#ffc94d" stroke-width="6" stroke-dasharray="20 8"/></g>
<g class="spin2"><circle cx="100" cy="100" r="55" fill="none" stroke="#4cc9f0" stroke-width="4" stroke-dasharray="6 6"/></g><text x="100" y="118" text-anchor="middle" font-size="52" fill="#ffc94d">π</text></svg>
<p>Nama penyaji: <input type="text" placeholder="Nama" size="14"> Kelas: <input type="text" placeholder="Kelas" size="6"><br>Mata pelajaran: Matematika — Lingkaran</p></div><div class="em fl" style="animation-delay:.8s">👧</div></div>`);

/* ===== 2. Peta ===== */
add("Peta Misi",`<h2>Peta Misi</h2><p>Lima lokasi akan menyala saat materinya selesai. Klik lokasi untuk pergi ke sana.</p><div class="map">${LOC.map((l,i)=>`<button class="card loc btn" data-i="${i}" style="background:var(--card)"><div class="em">${l[1]}</div><b>${i+1}. ${l[0]}</b></button>`).join('')}</div>`,
 s=>s.querySelectorAll('.loc').forEach(b=>b.onclick=()=>go(LOC[b.dataset.i][2])));

/* ===== 3. Mengenal Lingkaran ===== */
add("Mengenal Lingkaran",`<h2>Desa Bentuk Geometri: Mengenal Lingkaran</h2><div class="row"><div class="card"><p>Lingkaran adalah kumpulan titik pada bidang yang berjarak sama dari satu titik tetap, yaitu <b>pusat lingkaran</b>.</p><p class="em" style="text-align:center">🛞 ⏰ 🪙 🍽️</p><p>Roda, jam dinding, koin, dan piring berbentuk lingkaran.</p></div>
<svg viewBox="0 0 240 240" width="260"><circle cx="120" cy="120" r="90" fill="none" stroke="#fff4" stroke-dasharray="4 6"/><circle cx="120" cy="120" r="5" fill="#ffc94d"/><text x="130" y="112" fill="#ffc94d" font-size="16">O</text>
<g><animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="6s" repeatCount="indefinite"/><line x1="120" y1="120" x2="210" y2="120" stroke="#3ddc97" stroke-width="3"/><circle cx="210" cy="120" r="9" fill="#4cc9f0"/></g></svg></div>
<p class="note">Titik biru bergerak, tetapi jaraknya ke pusat O selalu sama (garis hijau).</p>`);

/* ===== 4. Asal-usul ===== */
add("Asal-Usul Lingkaran",`<h2>Asal-Usul Lingkaran</h2><p class="em" style="text-align:center">🌕 🛞 🏺 🔭 📐</p><div class="row"><div class="card"><p>Sejak dahulu manusia melihat lingkaran pada Matahari, Bulan, dan riak air.</p></div><div class="card"><p>Kebutuhan membuat roda, mengukur tanah, membangun, dan mengamati benda langit mendorong manusia mempelajari lingkaran.</p></div></div>
<p class="note">Penggunaan lingkaran jauh lebih tua daripada rumus tertulisnya. Rumus lingkaran dikembangkan bertahap oleh banyak budaya, bukan oleh satu orang.</p>`);

/* ===== 5. Rahasia π ===== */
add("Rahasia Angka π",`<h2>Hutan Misteri π</h2><div class="row"><div class="em fl">🧙</div><div class="bub">Ukuran lingkaran boleh berbeda, tetapi satu perbandingan selalu sama: <b>π</b>!</div></div>
<div class="big">π = keliling ÷ diameter</div><div class="row"><div class="card"><p>π ≈ 3,14</p><p>π ≈ 22/7 (untuk perhitungan tertentu)</p></div><div class="card"><p>π bilangan irasional: 3,14159265358979… desimalnya tidak berakhir dan tidak berpola berulang.</p></div></div>
<button class="btn rv">Petunjuk: apakah 22/7 sama dengan π?</button><p class="hid note">Tidak. 22/7 = 3,142857142857… hanya pendekatan. π tidak bisa ditulis tepat sebagai pecahan.</p>`);

/* ===== 6. Sejarah π ===== */
const HIS=[["Zaman kuno","Bangsa Babilonia memakai pendekatan sekitar 3,125 dan Mesir Kuno sekitar 3,16 untuk keperluan praktis seperti ukuran luas."],["Archimedes (abad ke-3 SM)","Ia memakai poligon 96 sisi di dalam dan di luar lingkaran. Hasilnya: 3 10/71 < π < 3 1/7."],["Abad-abad berikutnya","Para matematikawan mengembangkan metode baru, termasuk deret tak hingga dan kemudian komputer, sehingga π dihitung semakin teliti."],["Simbol π","William Jones memakai simbol π pada 1706. Leonhard Euler kemudian membuatnya populer pada abad ke-18."]];
add("Sejarah π",`<h2>Sejarah Penemuan Nilai π</h2><div class="row tl">${HIS.map((h,i)=>`<button class="btn" data-i="${i}">${i+1}. ${h[0]}</button>`).join('')}</div><div class="card" id="th" style="margin-top:14px"><p>Klik satu titik pada garis waktu.</p></div><p class="note">Tidak ada satu orang yang "menemukan" π. π adalah sifat tetap lingkaran; manusia memperkirakannya makin teliti. Pendekatan kuno berbeda dari nilai π modern.</p>`,
 s=>s.querySelectorAll('.tl .btn').forEach(b=>b.onclick=()=>{s.querySelectorAll('.tl .btn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');s.querySelector('#th').innerHTML=`<p><b>${HIS[b.dataset.i][0]}</b><br>${HIS[b.dataset.i][1]}</p>`}));

/* ===== 6b. Asal-usul 22/7 dan 3,14 (data bisa diedit di sini) ===== */
const AP=[["3,14",3.14,"Pembulatan π = 3,14159… ke dua angka desimal. Mudah dipakai jika jari-jari atau diameter berupa bilangan desimal, misalnya 10 cm atau 25 cm. Nilainya berada di antara batas Archimedes."],
["22/7",22/7,"Berasal dari batas atas Archimedes: 3 1/7 = 22/7. Pecahan sederhana ini sangat dekat dengan π dan nyaman dipakai jika jari-jari atau diameter kelipatan 7. Nilainya sedikit lebih besar dari π."],
["3 10/71",223/71,"Batas bawah Archimedes. Bersama 3 1/7, nilai ini menjepit π: π berada di antara keduanya."]];
const fx=x=>x.toFixed(6).replace('.',',');
add("Asal-Usul 22/7 dan 3,14",`<h2>Dari mana 22/7 dan 3,14?</h2><p>Keduanya bukan nilai π yang tepat, melainkan pendekatan. Pilih satu untuk melihat asalnya.</p><div class="row ap">${AP.map((a,i)=>`<button class="btn" data-i="${i}">${a[0]}</button>`).join('')}</div><div class="card" id="ad" style="margin-top:12px"><p>Klik salah satu nilai di atas.</p></div>
<p class="note">Archimedes menjepit π: 3 10/71 &lt; π &lt; 3 1/7, atau sekitar 3,1408 &lt; π &lt; 3,1429. Selisih 22/7 terhadap π (sekitar 0,0013) sedikit lebih kecil daripada selisih 3,14 (sekitar 0,0016). 22/7 sedikit di atas π, sedangkan 3,14 sedikit di bawah π.</p>`,
 s=>s.querySelectorAll('.ap .btn').forEach(b=>b.onclick=()=>{s.querySelectorAll('.ap .btn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
  const a=AP[b.dataset.i],d=a[1]-Math.PI;
  s.querySelector('#ad').innerHTML=`<p><b>${a[0]}</b> = ${fx(a[1])}</p><p>${a[2]}</p><p>Selisih terhadap π: ${fx(Math.abs(d))} (${d>0?'lebih besar':'lebih kecil'} dari π).<br>Contoh d = 100 cm: K = ${f2(a[1]*100)} cm, sedangkan π sebenarnya memberi sekitar ${f2(Math.PI*100)} cm.</p>`}));

/* ===== 7. Eksperimen π ===== */
add("Eksperimen π",`<h2>Eksperimen Menemukan π</h2><table><tr><th>Lingkaran</th><th>Diameter</th><th>Keliling</th><th>K ÷ d</th></tr>${[["A",7],["B",14],["C",21]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]} cm</td><td>${f2(Math.PI*r[1])} cm</td><td>${f4(Math.PI)}</td></tr>`).join('')}<tr style="color:var(--gold)"><td>Milikmu</td><td><span class="d"></span> cm</td><td><span class="k"></span> cm</td><td><span class="q"></span></td></tr></table>
<p>Geser diameter lingkaran milikmu: <input type="range" min="1" max="40" value="10"></p><svg viewBox="0 0 220 120" width="220"><circle class="c" cx="110" cy="60" r="30" fill="#7c5cff55" stroke="#ffc94d" stroke-width="3"/></svg>
<p class="note">Ukuran berubah, tetapi keliling ÷ diameter tetap mendekati 3,14 = π.</p>`,
 s=>{const r=s.querySelector('input'),u=()=>{const d=+r.value;s.querySelector('.d').textContent=d;s.querySelector('.k').textContent=f2(Math.PI*d);s.querySelector('.q').textContent=f4(Math.PI*d/d);s.querySelector('.c').setAttribute('r',d*1.4)};r.oninput=u;u()});

/* ===== 8. Jari-jari ===== */
add("Menara Jari-Jari",`<h2>Menara Jari-Jari</h2><p>Jari-jari (r) adalah jarak dari pusat O ke titik mana pun pada keliling.</p><div class="row"><svg viewBox="0 0 300 220" width="300"><circle class="c" cx="150" cy="110" r="70" fill="#7c5cff44" stroke="#ffc94d" stroke-width="3"/><line class="l" x1="150" y1="110" x2="220" y2="110" stroke="#3ddc97" stroke-width="4"/><circle cx="150" cy="110" r="4" fill="#fff"/><text x="135" y="105" fill="#fff">O</text><text class="a" x="225" y="105" fill="#fff">A</text><text class="t" x="180" y="130" fill="#3ddc97" font-size="16">r</text></svg>
<div><p>Panjang r = <b class="v"></b> cm</p><input type="range" min="1" max="10" value="7"></div></div>
<p><b>Contoh:</b> Diameter lingkaran 10 cm. Berapa jari-jarinya?</p><button class="btn rv">Lihat jawaban</button><p class="hid note">r = d ÷ 2 = 10 ÷ 2 = 5 cm.</p>`,
 s=>{const r=s.querySelector('input'),u=()=>{const R=r.value*10;s.querySelector('.c').setAttribute('r',R);s.querySelector('.l').setAttribute('x2',150+R);s.querySelector('.a').setAttribute('x',155+R);s.querySelector('.t').setAttribute('x',145+R/2);s.querySelector('.v').textContent=r.value};r.oninput=u;u()});

/* ===== 9. Diameter ===== */
add("Jembatan Diameter",`<h2>Jembatan Diameter</h2><p>Diameter (d) adalah garis lurus melalui pusat yang menghubungkan dua titik pada keliling.</p><div class="row"><svg viewBox="0 0 300 220" width="300"><circle class="c" cx="150" cy="110" r="70" fill="#7c5cff44" stroke="#fff6" stroke-width="3"/><line class="l1" x1="150" y1="110" x2="220" y2="110" stroke="#3ddc97" stroke-width="4"/><line class="l2" x1="150" y1="110" x2="80" y2="110" stroke="#ffc94d" stroke-width="4"/></svg>
<div><p><span style="color:#3ddc97">r</span> = <b class="r"></b> cm<br><span style="color:#ffc94d">d = 2r</span> = <b class="d"></b> cm</p><input type="range" min="1" max="10" value="5"></div></div><p class="big" style="font-size:clamp(20px,3vw,36px)">d = 2r &nbsp; r = d/2</p>
<div class="row"><div class="card"><p>Contoh 1: r = 6 cm, d = ?</p><div class="steps"><p class="st hid">d = 2 × r</p><p class="st hid">d = 2 × 6 = 12 cm</p></div><button class="btn sb">Langkah berikutnya</button></div><div class="card"><p>Contoh 2: d = 18 cm, r = ?</p><div class="steps"><p class="st hid">r = d ÷ 2</p><p class="st hid">r = 18 ÷ 2 = 9 cm</p></div><button class="btn sb">Langkah berikutnya</button></div></div>`,
 s=>{const r=s.querySelector('input'),u=()=>{const R=r.value*14;s.querySelector('.c').setAttribute('r',R);s.querySelector('.l1').setAttribute('x2',150+R);s.querySelector('.l2').setAttribute('x2',150-R);s.querySelector('.r').textContent=r.value;s.querySelector('.d').textContent=2*r.value};r.oninput=u;u()});

/* ===== 10. Luas: juring disusun ulang ===== */
add("Gua Luas Lingkaran",`<h2>Gua Luas Lingkaran</h2><p>Luas adalah ukuran daerah di dalam lingkaran. Bagi lingkaran menjadi juring, lalu susun bergantian.</p><svg viewBox="0 0 640 230" style="width:min(760px,96%)"></svg>
<p>Jumlah juring: <b class="n"></b> <input type="range" min="0" max="7" value="1"></p>
<p class="note">Makin banyak juring, bentuk makin mirip persegi panjang: panjang ≈ ½ keliling = πr, lebar = r.<br>Luas = πr × r = <b>L = πr²</b></p>`,
 s=>{const N=[4,6,8,12,16,24,36,72],svg=s.querySelector('svg'),R=80,r=s.querySelector('input');
 function u(){const n=N[r.value],th=2*Math.PI/n,a=R*Math.sin(th/2),b=R*Math.cos(th/2);
  const P=`M0,0 L${-a},${-b} A${R},${R} 0 0 1 ${a},${-b} Z`,col=i=>i%2?'#7c5cff':'#ffc94d';let h='';
  for(let i=0;i<n;i++)h+=`<path d="${P}" transform="translate(110,110) rotate(${(i+.5)*360/n})" fill="${col(i)}" stroke="#120d33" stroke-width=".8"/>`;
  const w=(n+1)*a,x0=420-w/2;
  for(let i=0;i<n;i++){const up=i%2==0;h+=`<path d="${P}" transform="translate(${x0+i*a+a},${up?190:190-b}) ${up?'':'rotate(180)'}" fill="${col(i)}" stroke="#120d33" stroke-width=".8"/>`}
  h+=`<text x="420" y="225" text-anchor="middle" fill="#3ddc97" font-size="14">panjang ≈ πr</text><text x="${x0+w+14}" y="150" fill="#3ddc97" font-size="14">r</text>`;
  svg.innerHTML=h;s.querySelector('.n').textContent=n}
 r.oninput=u;u()});

/* ===== 11. Hitung luas ===== */
add("Misi Menghitung Luas",`<h2>Misi Menghitung Luas</h2><div class="row"><div class="card"><p>Taman berbentuk lingkaran berjari-jari 7 m. Berapa luasnya?</p><div class="steps"><p class="st hid">1. Diketahui r = 7 m</p><p class="st hid">2. Rumus L = πr²</p><p class="st hid">3. L = 22/7 × 7 × 7</p><p class="st hid">4. L = 154 m²</p></div><button class="btn sb">Langkah berikutnya</button><p class="note">Satuan luas berupa persegi (m²) karena luas menghitung banyaknya kotak 1 m × 1 m di dalam taman.</p></div>
<div class="card"><b>Latihan</b><div class="pr" data-k="L"></div></div></div>`,s=>pr(s.querySelector('.pr'),'L'));

/* ===== 12. Keliling ===== */
add("Istana Keliling Lingkaran",`<h2>Istana Keliling Lingkaran</h2><p>Keliling adalah panjang garis yang mengelilingi lingkaran. Bentangkan pitanya!</p><svg viewBox="0 0 420 220" style="width:min(640px,96%)"><circle cx="70" cy="60" r="50" fill="#7c5cff44" stroke="#fff3" stroke-width="3"/><circle class="rb" cx="70" cy="60" r="50" fill="none" stroke="#ffc94d" stroke-width="6" stroke-dasharray="314.16" transform="rotate(-90 70 60)" style="transition:stroke-dashoffset 3s linear"/><line x1="20" y1="60" x2="120" y2="60" stroke="#3ddc97" stroke-width="3"/><text x="60" y="52" fill="#3ddc97" font-size="13">d</text>
<line class="ln" x1="20" y1="170" x2="20" y2="170" stroke="#ffc94d" stroke-width="6" style="transition:all 3s linear"/>${[120,220,320].map((x,i)=>`<line x1="${x}" y1="160" x2="${x}" y2="190" stroke="#3ddc97"/><text x="${x-45}" y="205" fill="#3ddc97" font-size="12">d ke-${i+1}</text>`).join('')}<text x="334" y="205" fill="#ffc94d" font-size="12">+ 0,14 d</text></svg>
<div><button class="btn go">Bentangkan pita</button><button class="btn rs">Ulangi</button></div><div class="big" style="font-size:clamp(22px,3.5vw,44px)">K = πd = 2πr</div><p class="note">Pita sepanjang keliling selalu sama dengan sedikit lebih dari 3 kali diameter (π ≈ 3,14). Karena d = 2r, maka K = 2πr.</p>`,
 s=>{const rb=s.querySelector('.rb'),ln=s.querySelector('.ln');rb.style.strokeDashoffset=0;
 s.querySelector('.go').onclick=()=>{rb.style.strokeDashoffset=314.16;ln.setAttribute('x2',334)};
 s.querySelector('.rs').onclick=()=>{rb.style.transition=ln.style.transition='none';rb.style.strokeDashoffset=0;ln.setAttribute('x2',20);void rb.getBoundingClientRect();rb.style.transition=ln.style.transition='all 3s linear'};ln.setAttribute('x2',20)});

/* ===== 13. Hitung keliling ===== */
add("Misi Menghitung Keliling",`<h2>Misi Menghitung Keliling</h2><div class="row"><div class="card"><p>Kolam lingkaran berdiameter 14 m. Berapa kelilingnya?</p><div class="steps"><p class="st hid">1. Diketahui d = 14 m</p><p class="st hid">2. Rumus K = πd</p><p class="st hid">3. K = 22/7 × 14</p><p class="st hid">4. K = 44 m</p></div><button class="btn sb">Langkah berikutnya</button><p class="note">Keliling adalah panjang, jadi satuannya meter (m), bukan m².</p></div><div class="card"><b>Latihan</b><div class="pr" data-k="K"></div></div></div>`,s=>pr(s.querySelector('.pr'),'K'));

/* ===== 14. Luas vs Keliling ===== */
add("Luas dan Keliling",`<h2>Perbedaan Luas dan Keliling</h2><div class="row"><div class="card"><svg viewBox="0 0 120 120" width="140"><circle cx="60" cy="60" r="50" fill="#4cc9f0" class="pulse"/></svg><h3>Luas</h3><p>Mengukur daerah di dalam lingkaran.<br>L = πr²<br>Satuan: cm², m²</p></div><div class="card"><svg viewBox="0 0 120 120" width="140"><circle cx="60" cy="60" r="50" fill="none" stroke="#ffc94d" stroke-width="9"/></svg><h3>Keliling</h3><p>Mengukur panjang batas lingkaran.<br>K = πd = 2πr<br>Satuan: cm, m</p></div></div>`);

/* ===== 15. Kuis ===== */
const Q=[{q:"Apa itu π?",o:["Perbandingan keliling terhadap diameter","Perbandingan jari-jari terhadap diameter","Tepat sama dengan 22/7","Luas dibagi jari-jari"],a:0,e:"π = keliling ÷ diameter, sama untuk semua lingkaran. 22/7 hanya pendekatan."},
{q:"Manakah pernyataan yang benar?",o:["Jari-jari melalui pusat dan menghubungkan dua titik di keliling","Diameter dari pusat ke keliling","Diameter melalui pusat dan menghubungkan dua titik di keliling","Jari-jari dua kali diameter"],a:2,e:"Diameter melalui pusat dan ujungnya di keliling. Jari-jari hanya dari pusat ke keliling."},
{q:"Jari-jari 9 cm. Berapa diameternya?",o:["4,5 cm","9 cm","18 cm","81 cm"],a:2,e:"d = 2r = 2 × 9 = 18 cm."},
{q:"Luas lingkaran berjari-jari 7 cm (π = 22/7)?",o:["44 cm²","154 cm²","308 cm²","49 cm²"],a:1,e:"L = 22/7 × 7 × 7 = 154 cm²."},
{q:"Keliling lingkaran berdiameter 21 cm (π = 22/7)?",o:["33 cm","66 cm","132 cm","462 cm"],a:1,e:"K = 22/7 × 21 = 66 cm."}];
add("Tantangan Penjaga",`<h2>Tantangan Penjaga Lingkaran 🛡️</h2><div class="card qz"></div>`,s=>{let i=0,sc=0;const box=s.querySelector('.qz');
 function show(){if(i>=Q.length){box.innerHTML=`<p class="big">Skor: ${sc} / ${Q.length}</p><p>${sc==5?'Sempurna! Penjaga membukakan gerbang.':sc>=3?'Bagus! Ulangi untuk skor penuh.':'Ayo pelajari lagi slide sebelumnya, lalu coba lagi.'}</p><button class="btn">Ulangi kuis</button>`;box.querySelector('button').onclick=()=>{i=sc=0;show()};return}
  const q=Q[i];let pick=-1;box.innerHTML=`<p><b>${i+1}/${Q.length}.</b> ${q.q}</p>${q.o.map((o,j)=>`<button class="btn op" data-j="${j}">${o}</button><br>`).join('')}<button class="btn go" disabled>Periksa</button><p class="fb"></p>`;
  const go=box.querySelector('.go'),ops=box.querySelectorAll('.op');
  ops.forEach(b=>b.onclick=()=>{ops.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');pick=+b.dataset.j;go.disabled=false});
  go.onclick=()=>{ops.forEach(x=>x.disabled=true);const ok=pick==q.a;if(ok){sc++;burst()}ops[q.a].classList.add('ok');if(!ok)ops[pick].classList.add('no');box.querySelector('.fb').textContent=(ok?'✅ Benar! ':'❌ Kurang tepat. ')+q.e;go.textContent=i==Q.length-1?'Lihat skor':'Lanjut';go.onclick=()=>{i++;show()}}}
 show()});

add("Boss Battle",`<h2>Boss Battle: Pecahkan Misteri 👑</h2><p>Taman berbentuk lingkaran berjari-jari 14 m. Penjaga akan memasang pagar di sekelilingnya dan menanam rumput di seluruh bagian dalamnya. (π = 22/7)</p>
<p>1. Panjang pagar: <input type="text" size="6" class="a1"> m<br>2. Luas rumput: <input type="text" size="6" class="a2"> m²</p><button class="btn go">Periksa</button><button class="btn rv">Petunjuk</button><p class="hid note">Pagar = keliling (K = 2πr). Rumput = luas (L = πr²).</p><p class="fb"></p>
<button class="btn rv">Pembahasan</button><div class="hid card"><p>1. K = 2 × 22/7 × 14 = <b>88 m</b><br>2. L = 22/7 × 14 × 14 = <b>616 m²</b></p></div>`,
 s=>s.querySelector('.go').onclick=()=>{const v=c=>parseFloat(s.querySelector(c).value.replace(',','.')),k=v('.a1')==88,l=v('.a2')==616;s.querySelector('.fb').textContent=k&&l?'✅ Hebat! Keduanya benar.':`${k?'✅':'❌'} Pagar   ${l?'✅':'❌'} Rumput — coba lagi atau buka petunjuk.`;if(k&&l)burst()});

add("Peta Pengetahuan",`<h2>Ringkasan: Peta Pengetahuan</h2><svg viewBox="0 0 720 320" style="width:min(900px,98%)"><style>.ln{stroke:#ffc94d;stroke-width:2;stroke-dasharray:300;stroke-dashoffset:300;animation:dr 2s forwards}@keyframes dr{to{stroke-dashoffset:0}}</style></svg>`,
 s=>{const N=[[120,50,"📍 Pusat O"],[120,270,"📏 Jari-jari r"],[360,40,"↔️ Diameter d = 2r"],[360,285,"🔢 π = K ÷ d"],[600,50,"🟦 Luas L = πr²"],[600,270,"🎀 K = πd = 2πr"]];
 let h='';N.forEach(n=>h+=`<line class="ln" x1="360" y1="160" x2="${n[0]}" y2="${n[1]}"/>`);

const st=document.getElementById('stage');let cur=-1,max=0;
S.forEach((x,i)=>{const e=document.createElement('section');e.className='s';e.innerHTML=x.h;st.appendChild(e);x.e=e;if(x.i)x.i(e)});
function go(n){n=Math.max(0,Math.min(S.length-1,n));if(n==cur)return;if(cur>=0){const o=S[cur].e;o.classList.remove('on');o.classList.add('out');setTimeout(()=>o.classList.remove('out'),500)}
 cur=n;max=Math.max(max,n);S[n].e.classList.add('on');S[n].e.scrollTop=0;
 document.getElementById('pf').style.width=(n+1)/S.length*100+'%';document.getElementById('pt').textContent=`Slide ${n+1}/${S.length} · ${S[n].t}`;
 document.getElementById('prev').disabled=n==0;document.getElementById('next').disabled=n==S.length-1;
 document.querySelectorAll('.loc').forEach((b,i)=>b.classList.toggle('act',max>=LOC[i][3]))}
document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)&&e.key.startsWith('Arrow')&&e.target.type!='range')return;
 if(e.key=='ArrowRight')go(cur+1);else if(e.key=='ArrowLeft')go(cur-1);else if(e.key=='f'&&!/INPUT|TEXTAREA/.test(e.target.tagName))document.getElementById('fs').click()});
go(0);
